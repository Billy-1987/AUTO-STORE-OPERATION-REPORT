[project]
name = "auto-store-operation-report"
version = "0.1.0"
description = "门店经营自动简报系统：定时跑 SQL → AI 分析 → 钉钉分发"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "jinja2>=3.1",
    "openai>=1.55",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
